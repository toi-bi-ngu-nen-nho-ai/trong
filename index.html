    <meta charset="UTF-8" />
    <!-- KHÔNG đặt maximum-scale/user-scalable=no: chặn phóng to là vi phạm WCAG 1.4.4, và với một
         app tra liều thì đó còn là vấn đề an toàn — người đeo kính lão trực đêm phải phóng to được
         con số tốc độ bơm. Nguyên nhân gốc khiến người ta hay chặn zoom (iOS tự phóng khi chạm ô
         nhập) đã được xử lý bằng cách để cỡ chữ ô nhập ≥ 16px, xem index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ─── KHÔNG BÊN THỨ BA (chủ dự án chốt 2026-09-05) ────────────────────────────────────────
         Đây là sổ tay lâm sàng: URL bác sĩ dán vào bảng, ảnh trong bệnh án, tên tệp — không thứ nào
         được rời máy. Cây BlockSuite vendored có ÍT NHẤT tám điểm gọi mạng ra ngoài (đếm 2026-09-05:
         link-preview-service.ts:113 và :86 — cái sau gọi thẳng `api.fxtwitter.com` VIẾT CỨNG, không
         qua endpoint cấu hình được; embed-{github,loom,youtube}/utils.ts; embed-iframe-service.ts:122;
         adapters/utils/fetch.ts:15; attachment/adapters/notion-html.ts:66). Vá từng điểm là mong
         manh — D11 cấm sửa cây vendored, và bản nâng cấp sau sẽ thêm điểm mới mà không ai hay.
         CSP là lớp DUY NHẤT cưỡng chế được: trình duyệt chặn, không phải JS tự hứa.

         CỐ Ý CHỈ KHAI HAI CHỈ THỊ:
         - `connect-src 'self'` — chặn mọi fetch/XHR/WebSocket/beacon ra khác nguồn. Mọi lời gọi của
           chính app đều là đường dẫn tương đối cùng nguồn (`/static/templates/…`, xem mau-dongnao.ts
           và mau-handy.ts) nên không gãy gì. Vite HMR dùng ws cùng nguồn, cũng qua.
         - `img-src 'self' data: blob:` — ảnh chỉ từ máy mình, `data:` cho ảnh nội tuyến, `blob:` cho
           ảnh người dùng dán vào kho blob. Chặn luôn đường "tải ảnh từ URL ngoài" ngầm.
         KHÔNG khai `script-src`/`style-src`: script nội tuyến ngay dưới đây và của Vite sẽ chết,
         đổi một rủi ro riêng tư lấy một app trắng màn hình.
         KHÔNG khai `frame-src`: khối nhúng là nội dung bác sĩ CHỦ ĐỘNG dán và muốn xem, khác hẳn
         lời gọi ngầm sau lưng. Muốn siết tuyệt đối thì thêm `frame-src 'none'` — đổi lại thẻ nhúng
         thành ô trống. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self'; img-src 'self' data: blob:"
    />
    <title>Bác sĩ Trọng — Sổ tay lâm sàng</title>
    <meta name="description" content="Thư viện kiến thức lâm sàng cá nhân: bài học chuyên khoa, tra cứu kháng sinh, flashcard ôn tập và mindmap." />
    <link rel="manifest" href="/manifest.json" />
    <!-- Khớp --c-primary bản sáng hiện tại (indigo, xem DESIGN.md) — trước đây để #00766e (teal đời
         đầu, đã bỏ qua hai lần đổi bảng màu: teal → azure → indigo), lệch hẳn với theme_color trong
         manifest.json lẫn màu thật của app. theme-color quyết định màu thanh trạng thái/thanh công
         cụ Android và màu nền task-switcher khi chưa cài PWA. -->
    <!-- Trước đây chỉ MỘT thẻ theme-color tĩnh (#2d3a94, màu primary sáng) — hệ điều hành đọc thẻ
         này SỚM HƠN bất kỳ dòng JS nào chạy được (áp cho màn hình khởi động/thanh trạng thái lúc cài
         PWA mở lạnh), còn applyTheme() trong src/main.tsx dù đã chạy sớm nhất có thể (trước cả
         ReactDOM.render) cũng KHÔNG kịp — hệ điều hành đã chụp màu tĩnh này trước đó. Máy đang bật
         chế độ tối thấy một nháy màu primary sáng (#2d3a94) rồi mới đổi sang đúng --c-surface tối
         (#14162c) — đúng dải màu "tràn lên trên" chỉ thấy LÚC CÓ LÚC KHÔNG, tuỳ máy đang ở chế độ gì
         và tuỳ có phải mở lạnh (splash mới) hay chỉ quay lại app đang chạy nền.
         Sửa: khai HAI biến thể tĩnh theo prefers-color-scheme, đúng --c-surface từng bản (xem
         index.css) — hệ điều hành tự chọn đúng ngay từ đầu, không cần đợi JS. Thẻ theme-color
         KHÔNG có `media` ở dưới vẫn giữ lại làm phương án dự phòng cho trình duyệt không hiểu cú
         pháp nhiều thẻ theme-color, và applyTheme() vẫn cần chạy để xử lý trường hợp người dùng CHỌN
         TAY một chế độ khác hẳn cài đặt hệ thống (data-theme) — prefers-color-scheme không biết gì
         về lựa chọn thủ công đó. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14162c" />
    <meta name="theme-color" content="#2d3a94" />
    <!-- ─── Phân giải chủ đề TRƯỚC LẦN VẼ ĐẦU (bắt buộc nội tuyến, chặn phân tích cú pháp) ───
         LỖI NÓ CHỮA (chủ dự án báo 2026-09-04, "lỗi RẤT NẶNG"): ba thẻ ngay trên chọn màu theo
         prefers-color-scheme, tức theo cài đặt CỦA MÁY. Nhưng app còn cho CHỌN TAY sáng/tối
         (localStorage "drtrong:theme"), và lựa chọn đó trước đây chỉ được đọc trong bundle JS. Ai chọn tay
         khác cài đặt máy — chọn "Tối" trong lúc iPhone đang ở chế độ sáng chẳng hạn — thì suốt quãng
         từ lúc trình duyệt phân tích xong <head> tới lúc bundle chạy được, thanh trạng thái ĐANG
         TRẮNG còn trang thì sắp đen: mạng chậm hay máy giật là quãng đó dài ra thành mấy giây, hai
         nửa màn hình lệch hẳn nhau. iOS còn hoà màu DẦN thanh đó chứ không đổi phắt (ở PWA
         standalone thì KHÔNG đọc lại lần nào nữa), nên độ lệch còn kéo dài sau khi trang đã đúng màu.
         CÁCH CHỮA: quyết định màu ngay tại đây, trong <head>, trước cả khi <body> được phân tích —
         cùng một nguồn sự thật (localStorage + prefers-color-scheme) mà applyTheme() dùng. Trình
         duyệt đọc theme-color SAU khi script nội tuyến trong <head> chạy xong, nên nó thấy đúng màu
         ngay từ đầu; applyTheme() chạy sau chỉ ghi lại đúng giá trị này.
         Phần thưởng kèm theo: đặt sẵn data-theme cũng xoá luôn cú nháy trắng của lần vẽ đầu khi
         người dùng chọn tay bản tối trên một máy đang để bản sáng.
         KHÔNG dùng type="module"/defer/async: cả ba đều hoãn tới sau khi phân tích xong tài liệu, tức
         là mất đúng thứ duy nhất script này cần.
         HAI MÃ MÀU DƯỚI ĐÂY LÀ BẢN SAO của --c-surface (src/index.css) và của SURFACE_FALLBACK
         (src/lib/theme.ts) — không có cách nào import vào một script nội tuyến chạy trước mọi thứ.
         src/__tests__/mau-thanh-trang-thai-som.spec.ts khoá ba nơi đó lại với nhau VÀ CHẠY THẬT script
         này, nên bản sao lệch nhau là đỏ ngay, không âm thầm trôi như mã teal #00766e cũ. -->
    <script>
      (function () {
        try {
          var luu = localStorage.getItem('drtrong:theme')
          var che = luu === 'light' || luu === 'dark' ? luu : 'auto'
          var toi = che === 'dark' || (che === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', toi ? 'dark' : 'light')
          var mau = toi ? '#14162c' : '#ffffff'
          var the = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < the.length; i++) the[i].setAttribute('content', mau)
        } catch (e) {
          // localStorage bị chặn (Safari riêng tư) hay thiếu matchMedia: để nguyên ba thẻ tĩnh ở trên
          // lo — chúng vẫn đúng cho người dùng chưa chọn tay, tức là đa số.
        }
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- ĐÃ BỎ `apple-mobile-web-app-status-bar-style=black-translucent` (2026-08) — đây là nguyên
         nhân gốc của "thanh nav nhô cao, chừa khoảng trống ở đáy" khi cài ra màn hình chính iPhone.
         Đo trên iPhone Air (iOS 18.7 / Safari 26) bằng ViewportDebugPanel:
             screen.height = 912, window.innerHeight = 844, chênh đúng 68 = env(safe-area-inset-top)
         iOS rơi vào trạng thái lai nửa vời: TÍNH chiều cao khung nhìn theo kiểu "nằm dưới thanh
         trạng thái" (912 − 68 = 844), nhưng lại ĐẶT khung nhìn ở mép trên (y=0) và vẫn báo
         safe-area-inset-top = 68 theo kiểu "phủ dưới thanh trạng thái". Hệ quả: trang web kết thúc
         ở y=844 còn màn hình dài tới 912 — thừa 68px KHÔNG phần tử DOM nào với tới được (đã xác
         nhận bằng một vạch đỏ cắm ở đáy trong cùng thanh nav: vạch hiện đúng y=844, dưới nó vẫn
         còn nền màn hình). Bỏ thẻ này thì iOS đặt khung nhìn xuống dưới thanh trạng thái, 68 + 844
         = 912 khớp đúng đáy màn hình, và safe-area-inset-top về 0 nên khoảng chừa trên cũng tự
         co lại đúng.
         Đổi lại, thanh trạng thái không còn trong suốt mà lấy màu từ `theme-color` — nên màu đó
         phải bám theo màu nền app, xem applyTheme() trong src/lib/theme.ts. -->
    <meta name="apple-mobile-web-app-title" content="Bác sĩ Trọng" />
