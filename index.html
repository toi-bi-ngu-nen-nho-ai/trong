<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- KHÔNG đặt maximum-scale/user-scalable=no: chặn phóng to là vi phạm WCAG 1.4.4, và với một
         app tra liều thì đó còn là vấn đề an toàn — người đeo kính lão trực đêm phải phóng to được
         con số tốc độ bơm. Nguyên nhân gốc khiến người ta hay chặn zoom (iOS tự phóng khi chạm ô
         nhập) đã được xử lý bằng cách để cỡ chữ ô nhập ≥ 16px, xem index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bác sĩ Trọng — Sổ tay lâm sàng</title>
    <meta name="description" content="Thư viện kiến thức lâm sàng cá nhân: bài học chuyên khoa, tra cứu kháng sinh, flashcard ôn tập và mindmap." />
    <link rel="manifest" href="/manifest.json" />
    <!-- Khớp --c-primary bản sáng hiện tại (indigo, xem DESIGN.md) — trước đây để #00766e (teal đời
         đầu, đã bỏ qua hai lần đổi bảng màu: teal → azure → indigo), lệch hẳn với theme_color trong
         manifest.json lẫn màu thật của app. theme-color quyết định màu thanh trạng thái/thanh công
         cụ Android và màu nền task-switcher khi chưa cài PWA. -->
    <meta name="theme-color" content="#2d3a94" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- ĐÃ BỎ `apple-mobile-web-app-status-bar-style=black-translucent` (2026-08) — đây là nguyên
         nhân gốc của "thanh nav nhô cao, chừa khoảng trống ở đáy" khi cài ra màn hình chính iPhone.
         Đo trên iPhone Air (iOS 18.7 / Safari 26) bằng ViewportDebugPanel:
             screen.height = 912, window.innerHeight = 844, chênh đúng 68 = env(safe-area-inset-top)
         iOS rơi vào trạng thái lai nửa vời: TÍNH chiều cao khung nhìn theo kiểu "nằm dưới thanh
         trạng thái" (912 − 68 = 844), nhưng lại ĐẶT khung nhìn ở mép trên (y=0) và vẫn báo
         safe-area-inset-top = 68 theo kiểu "phủ dưới thanh trạng thái". Hệ quả: trang web kết thúc
         ở y=844 còn màn hình dài tới 912 — thừa 68px KHÔNG phần tử DOM nào với tới được (đã xác
         nhận bằng một vạch đỏ cắm ở đáy trong cùng thanh nav: vạch hiện đúng y=844, dưới nó vẫn
         còn nền màn hình). Bỏ thẻ này thì iOS đặt khung nhìn xuống dưới thanh trạng thái, 68 + 844
         = 912 khớp đúng đáy màn hình, và safe-area-inset-top về 0 nên khoảng chừa trên cũng tự
         co lại đúng.
         Đổi lại, thanh trạng thái không còn trong suốt mà lấy màu từ `theme-color` — nên màu đó
         phải bám theo màu nền app, xem applyTheme() trong src/lib/theme.ts. -->
    <meta name="apple-mobile-web-app-title" content="Bác sĩ Trọng" />
    <!-- 180×180 riêng cho apple-touch-icon (kích cỡ Apple khuyến nghị cho icon màn hình chính) thay
         vì dùng chung file 192 rồi để iOS tự co giãn. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / link preview (iMessage, Zalo, Facebook...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bác sĩ Trọng" />
    <meta property="og:title" content="Bác sĩ Trọng — Sổ tay lâm sàng" />
    <meta property="og:description" content="Thư viện kiến thức lâm sàng cá nhân: bài học chuyên khoa, tra cứu kháng sinh, flashcard ôn tập và mindmap." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bác sĩ Trọng — Sổ tay lâm sàng" />
    <meta name="twitter:description" content="Thư viện kiến thức lâm sàng cá nhân cho bác sĩ và sinh viên y khoa." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
